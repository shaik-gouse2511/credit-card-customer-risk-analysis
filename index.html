<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Credit Card Risk Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="outputs/dashboard_data.js"></script>
    <style>
      :root{--ink:#10233f;--muted:#64748b;--line:#e2e8f0;--surface:#fff;--background:#f6f8fc;--blue:#2563eb;--blue-soft:#eff6ff;--green:#059669;--amber:#d97706;--red:#dc2626;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--background)}
      *{box-sizing:border-box}body{margin:0;background:var(--background)}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}
      .topbar{background:#0f172a;color:#fff;padding:22px clamp(20px,5vw,72px)}.topbar-inner,.content{max-width:1440px;margin:auto}.topbar-inner{display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{display:flex;align-items:center;gap:14px}.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#3b82f6;font-size:21px}h1,h2,p{margin:0}h1{font-size:clamp(22px,3vw,32px);letter-spacing:-.03em}.subtitle{color:#cbd5e1;margin-top:5px;font-size:14px}.download{border:1px solid #475569;background:#1e293b;color:#fff;border-radius:9px;padding:10px 14px;font-weight:700}.download:hover{background:#334155}
      .content{padding:28px clamp(20px,5vw,72px) 56px}.filters,.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(15,23,42,.04)}.filters{padding:18px;display:grid;grid-template-columns:repeat(4,1fr) auto;gap:12px;align-items:end}.field label{display:block;color:var(--muted);font-size:12px;font-weight:800;margin:0 0 6px 2px}select,input{width:100%;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:var(--ink);padding:10px 11px;outline:none}select:focus,input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #dbeafe}.reset{border:0;background:var(--blue-soft);color:var(--blue);border-radius:9px;padding:10px 15px;font-weight:800}
      .section-heading{display:flex;justify-content:space-between;align-items:end;margin:30px 0 14px}.section-heading h2{font-size:18px}.section-heading span,.muted{color:var(--muted);font-size:13px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.kpi{padding:20px;position:relative;overflow:hidden}.kpi:before{content:"";height:4px;background:var(--accent);position:absolute;inset:0 0 auto}.kpi-label{color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.kpi-value{margin-top:10px;font-size:30px;font-weight:850;letter-spacing:-.04em}.kpi-note{margin-top:5px;color:var(--muted);font-size:13px}
      .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{padding:20px}.card h3{font-size:16px;margin:0}.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.risk-layout{display:flex;align-items:center;gap:28px;min-height:220px}.donut{width:170px;height:170px;border-radius:50%;background:conic-gradient(var(--red) 0 20.3%,var(--amber) 20.3% 59.4%,var(--green) 59.4% 100%);display:grid;place-items:center;flex:0 0 auto}.donut-center{width:104px;height:104px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}.donut-center strong{display:block;font-size:24px}.donut-center span{color:var(--muted);font-size:11px}.risk-list{display:grid;gap:18px;width:100%}.risk-row{display:flex;justify-content:space-between;gap:12px;font-size:13px}.risk-row strong{font-size:15px}.dot{width:9px;height:9px;display:inline-block;border-radius:50%;margin-right:5px}
      .bar-row{display:grid;grid-template-columns:125px 1fr 52px;gap:10px;align-items:center;margin:15px 0;font-size:13px}.bar-track{height:10px;border-radius:99px;background:#eef2f7;overflow:hidden}.bar-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,#2563eb,#60a5fa)}
      .table-card{margin-top:14px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:820px;font-size:13px}th{color:var(--muted);background:#f8fafc;font-size:11px;text-transform:uppercase;letter-spacing:.04em}th,td{padding:13px 10px;border-bottom:1px solid #eef2f7;text-align:left;white-space:nowrap}tbody tr:hover{background:#f8fbff}.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.low{color:var(--green);background:#ecfdf5}.medium{color:var(--amber);background:#fffbeb}.high{color:var(--red);background:#fff1f2}.pager{display:flex;justify-content:space-between;align-items:center;padding-top:16px;color:var(--muted);font-size:13px}.pager button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 11px;margin-left:6px}.pager button:disabled{opacity:.4;cursor:not-allowed}
      @media(max-width:900px){.filters,.kpis{grid-template-columns:repeat(2,1fr)}.filters .reset{grid-column:span 2}.grid{grid-template-columns:1fr}}@media(max-width:560px){.topbar-inner,.section-heading,.risk-layout{align-items:flex-start;flex-direction:column}.download{width:100%}.filters,.kpis{grid-template-columns:1fr}.filters .reset{grid-column:auto}.risk-layout{align-items:center}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const {useMemo,useState}=React;
      const data=window.DASHBOARD_DATA||{kpis:{},customers:[],age_group_stats:[]};
      const eduLabels={1:"Graduate School",2:"University",3:"High School",4:"Others"};
      const payLabels={"-2":"No Activity","-1":"Paid in Full","0":"On Time","1":"Delayed 1 month","2":"Delayed 2 months"};
      const money=value=>`NT$ ${Math.round(value||0).toLocaleString()}`;
      const riskClass=risk=>risk==="High Risk"?"high":risk==="Medium Risk"?"medium":"low";
      function downloadCsv(){window.location.href="outputs/power_bi_credit_card_risk.csv"}
      function App(){
        const [risk,setRisk]=useState("ALL"),[edu,setEdu]=useState("ALL"),[pay,setPay]=useState("ALL"),[search,setSearch]=useState(""),[page,setPage]=useState(1);
        const pageSize=12;
        const filtered=useMemo(()=>data.customers.filter(customer=>{
          if(risk!=="ALL"&&customer.risk!==risk)return false;
          if(edu!=="ALL"&&String(customer.edu)!==edu)return false;
          if(pay!=="ALL"&&String(customer.p0)!==pay)return false;
          return !search||String(customer.id).includes(search.trim());
        }),[risk,edu,pay,search]);
        const metrics=useMemo(()=>{const total=filtered.length,defaults=filtered.filter(c=>c.act===1).length,high=filtered.filter(c=>c.risk==="High Risk").length,avgLimit=total?filtered.reduce((sum,c)=>sum+c.bal,0)/total:0;return{total,defaults,defaultRate:total?defaults/total*100:0,high,highRate:total?high/total*100:0,avgLimit}},[filtered]);
        const pageCount=Math.max(1,Math.ceil(filtered.length/pageSize)),rows=filtered.slice((page-1)*pageSize,page*pageSize),maxAgeCount=Math.max(...data.age_group_stats.map(item=>item.count),1);
        const reset=()=>{setRisk("ALL");setEdu("ALL");setPay("ALL");setSearch("");setPage(1)},change=setter=>event=>{setter(event.target.value);setPage(1)};
        return <div className="app">
          <header className="topbar"><div className="topbar-inner"><div className="brand"><div className="brand-mark">◈</div><div><h1>Credit Card Risk Dashboard</h1><p className="subtitle">Clear signals for customer default risk and portfolio decisions</p></div></div><button className="download" onClick={downloadCsv}>Download full CSV ↓</button></div></header>
          <main className="content">
            <section className="filters">
              <div className="field"><label>Risk level</label><select value={risk} onChange={change(setRisk)}><option value="ALL">All risk levels</option><option>Low Risk</option><option>Medium Risk</option><option>High Risk</option></select></div>
              <div className="field"><label>Education</label><select value={edu} onChange={change(setEdu)}><option value="ALL">All education levels</option>{Object.entries(eduLabels).map(([code,label])=><option key={code} value={code}>{label}</option>)}</select></div>
              <div className="field"><label>Recent payment</label><select value={pay} onChange={change(setPay)}><option value="ALL">All payment statuses</option>{Object.entries(payLabels).map(([code,label])=><option key={code} value={code}>{label}</option>)}</select></div>
              <div className="field"><label>Search customer</label><input value={search} onChange={change(setSearch)} placeholder="Customer ID"/></div><button className="reset" onClick={reset}>Reset filters</button>
            </section>
            <div className="section-heading"><h2>Portfolio snapshot</h2><span>{metrics.total.toLocaleString()} of {data.customers.length.toLocaleString()} accounts shown</span></div>
            <section className="kpis">
              <div className="card kpi" style={{"--accent":"#2563eb"}}><div className="kpi-label">Customers</div><div className="kpi-value">{metrics.total.toLocaleString()}</div><div className="kpi-note">Accounts in current view</div></div>
              <div className="card kpi" style={{"--accent":"#dc2626"}}><div className="kpi-label">Default rate</div><div className="kpi-value">{metrics.defaultRate.toFixed(1)}%</div><div className="kpi-note">{metrics.defaults.toLocaleString()} observed defaults</div></div>
              <div className="card kpi" style={{"--accent":"#d97706"}}><div className="kpi-label">High risk share</div><div className="kpi-value">{metrics.highRate.toFixed(1)}%</div><div className="kpi-note">{metrics.high.toLocaleString()} high-risk accounts</div></div>
              <div className="card kpi" style={{"--accent":"#059669"}}><div className="kpi-label">Average credit limit</div><div className="kpi-value">{money(metrics.avgLimit)}</div><div className="kpi-note">Portfolio average</div></div>
            </section>
            <div className="section-heading"><h2>Risk patterns</h2><span>Use the filters above to explore the portfolio</span></div>
            <section className="grid">
              <article className="card"><div className="card-head"><h3>Risk level distribution</h3><span className="muted">Share of accounts</span></div><div className="risk-layout"><div className="donut"><div className="donut-center"><div><strong>{data.kpis.high_risk_pct}%</strong><span>high risk</span></div></div></div><div className="risk-list">{[["High Risk",data.kpis.high_risk_count,"var(--red)"],["Medium Risk",data.kpis.med_risk_count,"var(--amber)"],["Low Risk",data.kpis.low_risk_count,"var(--green)"]].map(([label,count,color])=><div className="risk-row" key={label}><span><i className="dot" style={{background:color}}></i>{label}</span><strong>{count.toLocaleString()}</strong></div>)}</div></div></article>
              <article className="card"><div className="card-head"><h3>Customers by age group</h3><span className="muted">Account count</span></div>{data.age_group_stats.map(item=><div className="bar-row" key={item.group}><span>{item.group}</span><div className="bar-track"><div className="bar-fill" style={{width:`${item.count/maxAgeCount*100}%`}}></div></div><strong>{item.count.toLocaleString()}</strong></div>)}</article>
            </section>
            <section className="card table-card"><div className="card-head"><h3>Customer risk records</h3><span className="muted">Showing {rows.length} records</span></div><div className="table-wrap"><table><thead><tr><th>Customer ID</th><th>Credit limit</th><th>Age</th><th>Education</th><th>Payment status</th><th>Delinquent months</th><th>Default probability</th><th>Risk</th><th>Outcome</th></tr></thead><tbody>{rows.map(customer=><tr key={customer.id}><td><strong>#{customer.id}</strong></td><td>{money(customer.bal)}</td><td>{customer.age}</td><td>{eduLabels[customer.edu]||"Other"}</td><td>{payLabels[customer.p0]||`Delayed ${customer.p0} months`}</td><td>{customer.del_m}</td><td>{(customer.prob*100).toFixed(1)}%</td><td><span className={`badge ${riskClass(customer.risk)}`}>{customer.risk.replace(" Risk","")}</span></td><td>{customer.act?"Default":"Paid"}</td></tr>)}</tbody></table></div><div className="pager"><span>Page {page} of {pageCount}</span><div><button disabled={page===1} onClick={()=>setPage(current=>current-1)}>← Previous</button><button disabled={page===pageCount} onClick={()=>setPage(current=>current+1)}>Next →</button></div></div></section>
          </main>
        </div>
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
    </script>
  </body>
</html>
